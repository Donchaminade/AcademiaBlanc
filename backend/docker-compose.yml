services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: academiablanc
      POSTGRES_USER: academiablanc
      POSTGRES_PASSWORD: academiablanc
    ports:
      - "5432:5432"
    volumes:
      - academiablanc-pg:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/academiablanc
      SPRING_DATASOURCE_USERNAME: academiablanc
      SPRING_DATASOURCE_PASSWORD: academiablanc
      JWT_SECRET: dev-docker-secret-change-me-32chars
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      PORT: "8080"
    depends_on:
      - db

volumes:
  academiablanc-pg:
