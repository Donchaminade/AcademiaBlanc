server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-stacktrace: never

spring:
  application:
    name: academiablanc-api
  datasource:
    url: jdbc:h2:mem:academiablanc;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Plusieurs branches ajoutent des migrations indépendantes (nouvelles tables) ; une version
    # inférieure fusionnée après une version supérieure doit tout de même s'appliquer.
    out-of-order: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  seed:
    enabled: true
  platform:
    super-admin-email: ${SUPER_ADMIN_EMAIL:}
  jwt:
    secret: ${JWT_SECRET:dev-only-local-secret-change-me-32}
    expiration-hours: 12
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
