services:
  - type: web
    name: academiablanc-api
    runtime: docker
    region: frankfurt
    plan: starter
    branch: feat/backend-spring-admin
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://academia.vercel.app,https://academia-*.vercel.app,http://localhost:3000,http://127.0.0.1:3000
      - key: DATABASE_URL
        fromDatabase:
          name: academiablanc-db
          property: connectionString

databases:
  - name: academiablanc-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []
