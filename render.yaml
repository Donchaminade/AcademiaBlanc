services:
  - type: web
    name: academiablanc-api
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://academia-chaminadegithubs-projects.vercel.app,https://academia-ochre-chi.vercel.app
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0 -XX:+UseSerialGC"
      # Propriétaire du logiciel : compte SUPER_ADMIN créé automatiquement au démarrage.
      - key: SUPER_ADMIN_EMAIL
        value: chaminade.don.adjolou@gmail.com
      # Saisi dans le tableau de bord Render, jamais commité.
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: academiablanc-db
          property: connectionString

databases:
  - name: academiablanc-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
